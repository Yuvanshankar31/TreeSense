<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Index (AQI)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <link rel="stylesheet" href="/src/assets/css/styles.css">
</head>
<body class="chart-page">
    <div class="chart-container">
        <canvas id="aqiChart" width="800" height="450"></canvas>
    </div>

    <script src="/src/assets/js/shared/weather-charts.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const result = await GreenPulse.fetchMonthlySeries({
                url: function(lat, lon) {
                    return `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&hourly=us_aqi&start_date=2025-01-01&end_date=2025-12-31`;
                },
                responseSection: 'hourly',
                field: 'us_aqi',
                aggregation: 'mean',
                rounding: 'round',
                fallback: [68, 74, 85, 90, 80, 55, 48, 52, 60, 72, 88, 75],
                errorMessage: "Failed to fetch live historical AQI, using fallback."
            });
            GreenPulse.createWeatherChart({
                canvasId: 'aqiChart',
                chartType: 'line',
                dataset: {
                    label: 'Average US AQI',
                    data: result.values,
                    borderColor: '#e07a5f',
                    backgroundColor: 'rgba(224, 122, 95, 0.15)',
                    fill: true,
                    tension: 0.3,
                    borderWidth: 3,
                    pointBackgroundColor: '#3d405b',
                    pointBorderColor: '#ffffff',
                    pointHoverRadius: 7
                },
                location: result.location,
                title: 'Air Quality Index (AQI) History in ',
                yTickSuffix: ' AQI',
                yAxis: { beginAtZero: true }
            });
        });
    </script>
</body>
</html>
