<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Charts - GreenPulse Imaging</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/assets/css/styles.css">
    <link rel="stylesheet" href="/src/assets/css/chatbot.css">
</head>
<body class="dashboard-app-body">

    <!-- Unified Sleek App Header -->
    <header class="app-header">
        <div class="app-header-left">
            <a href="/index.html" class="app-brand">
                <img src="/images/treeicon.png" alt="GreenPulse logo">
                <span class="app-brand-title">Green<span>Pulse</span></span>
            </a>
            <div class="app-breadcrumb">
                <span>📈 Historical Analytics</span>
                <span style="opacity: 0.4;">/</span>
                <span>Environmental Telemetry</span>
            </div>
        </div>

        <div class="app-header-right">
            <ul class="app-nav-links">
                <li><a href="/index.html" class="app-nav-link">Home</a></li>
                <li><a href="/predict.html" class="app-nav-link">Dashboard</a></li>
                <li><a href="/chart.html" class="app-nav-link active">Historical Charts</a></li>
            </ul>

            <div class="app-status-pill">
                <span class="app-status-dot"></span>
                <span>Telemetry Active</span>
            </div>
        </div>
    </header>

    <!-- Compact Module Segmented Toolbar -->
    <div class="app-toolbar">
        <div class="app-segmented-tabs">
            <button id="rainfall-button" class="tab-pill active">
                <span>🌧️</span> Rainfall Departure
            </button>
            <button id="temperature-button" class="tab-pill">
                <span>🌡️</span> Temperature Trends
            </button>
            <button id="aqi-button" class="tab-pill">
                <span>💨</span> Air Quality Index
            </button>
            <button id="soil-button" class="tab-pill">
                <span>🌱</span> Soil Moisture Levels
            </button>
        </div>

        <div class="app-toolbar-meta">
            <span>Data: <strong>IMD & CPCB Sensor Feeds</strong></span>
            <span>•</span>
            <span style="color: #00e5a3;">Longitudinal Range: 2018 - 2026</span>
        </div>
    </div>

    <!-- Main Display Iframe Workspace (100% Flex Fill, Zero Outer Scrolling) -->
    <main class="app-workspace">
        <div class="app-iframe-wrapper">
            <iframe id="model-iframe" class="app-iframe" src="rainfall.html" title="Historical Environmental Chart"></iframe>
        </div>
    </main>

    <!-- Sleek Minimalist Status Bar -->
    <footer class="app-statusbar">
        <div>
            <span>GreenPulse Telemetry Services v2.4</span>
            <span style="margin: 0 8px; opacity: 0.3;">|</span>
            <span>Environmental Longitudinal Analysis</span>
        </div>
        <div>
            <span>&copy; 2026 GreenPulse Imaging</span>
            <span style="margin: 0 8px; opacity: 0.3;">|</span>
            <a href="/index.html">Back to Home</a>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/src/assets/js/script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const buttons = [
                { btn: document.getElementById('rainfall-button'), src: 'rainfall.html' },
                { btn: document.getElementById('temperature-button'), src: 'temperature.html' },
                { btn: document.getElementById('aqi-button'), src: 'aqi.html' },
                { btn: document.getElementById('soil-button'), src: 'soil.html' }
            ];
            
            const modelIframe = document.getElementById('model-iframe');

            buttons.forEach(item => {
                if (item.btn) {
                    item.btn.addEventListener('click', () => {
                        modelIframe.src = item.src;
                        buttons.forEach(x => { if (x.btn) x.btn.classList.remove('active'); });
                        item.btn.classList.add('active');
                    });
                }
            });
        });
    </script>
    <script src="/src/assets/js/chatbot.js" defer></script>
</body>
</html>
