<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Charts - GreenPulse Imaging</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/assets/css/styles.css">
    <link rel="stylesheet" href="/src/assets/css/chatbot.css">
</head>
<body>

    <div id="site-header-placeholder"></div>

    <!-- Main Content Layout -->
    <main class="container dashboard-layout">
        <div class="dashboard-title-bar">
            <h2>Historical Environmental Charts</h2>
            <p>Compare precipitation departure, temperature shifts, AQI trends, and soil moisture levels over time.</p>
        </div>

        <!-- Dashboard Sub-Tabs -->
        <div class="dashboard-tabs">
            <button id="rainfall-button" class="tab-button active">Rainfall Departure</button>
            <button id="temperature-button" class="tab-button">Temperature Trends</button>
            <button id="aqi-button" class="tab-button">Air Quality Index</button>
            <button id="soil-button" class="tab-button">Soil Moisture Levels</button>
        </div>

        <!-- Main Display Iframe Frame -->
        <div class="iframe-container">
            <iframe id="model-iframe" src="rainfall.html" title="Historical Environmental Chart"></iframe>
        </div>
    </main>

    <div id="site-footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/src/assets/js/shared/site-chrome.js"></script>
    <script src="/src/assets/js/script.js"></script>
    <script src="/src/assets/js/shared/tab-wiring.js"></script>
    <script>
        GreenPulse.wireIframeTabs([
            { btn: document.getElementById('rainfall-button'), src: 'rainfall.html' },
            { btn: document.getElementById('temperature-button'), src: 'temperature.html' },
            { btn: document.getElementById('aqi-button'), src: 'aqi.html' },
            { btn: document.getElementById('soil-button'), src: 'soil.html' }
        ], 'model-iframe');
    </script>
    <script src="/src/assets/js/chatbot.js" defer></script>
</body>
</html>
