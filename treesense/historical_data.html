<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js" integrity="sha384-7NrRHqlWUj2hJl3a/dZj/a1GxuQc56mJ3aYsEnydBYrY1jR+RSt6SBvK3sHfj+mJ" crossorigin="anonymous"></script>
    <script src="/src/assets/js/coordinates.js"></script>
    <script src="/src/assets/js/weather.js"></script>
    <link rel="stylesheet" href="/src/assets/css/styles.css">
    <style>
        body {
            background: #ffffff;
            padding: 24px;
        }
        .module-card {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 32px;
            box-shadow: var(--shadow-sm);
        }
        .search-form {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        .search-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            outline: none;
            font-size: 15px;
            font-weight: 500;
            transition: var(--transition-fast);
        }
        .search-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
    </style>
</head>
<body>

    <div class="module-card">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="font-size: 24px; color: var(--primary);">Live Location Weather</h2>
            <p style="font-size: 14px; color: var(--text-muted); margin-top: 6px;">Enter a location below to retrieve real-time meteorological conditions.</p>
        </div>

        <form id="location-form" class="search-form" onsubmit="return false;">
            <input type="text" id="location" class="search-input" placeholder="e.g. Coimbatore, IN">
            <button type="button" id="get-weather" class="btn btn-primary">Retrieve Weather</button>
        </form>

        <div id="weather" style="display: none; border-top: 1px solid var(--border); padding-top: 24px; margin-top: 20px;">
            <h3 style="font-size: 18px; color: var(--primary); margin-bottom: 16px;">Current Weather Metrics</h3>
            <div class="stats-grid" id="current-weather">
                <!-- Weather Metric Cards populated via app.js -->
            </div>
            
            <div style="display: none;">
                <h3 style="font-size: 18px; color: var(--primary); margin: 30px 0 16px 0;">Historical Weather</h3>
                <div class="chart-card">
                    <canvas id="historical-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Overrides -->
    <script>
        // We override the click callback in html to render beautiful metric cards instead of plain text paragraphs
        document.addEventListener('DOMContentLoaded', () => {
            const getWeatherButton = document.getElementById('get-weather');
            const locationInput = document.getElementById('location');
            const currentWeatherDiv = document.getElementById('current-weather');
            const weatherDiv = document.getElementById('weather');

            // Load stored location if present
            const storedLocation = localStorage.getItem('selectedLocation');
            if (storedLocation) {
                locationInput.value = storedLocation;
                const { lat, lon } = getSelectedCoordinates(11.0168, 76.9558);
                fetchWeather(storedLocation, lat, lon);
            }

            getWeatherButton.addEventListener('click', async () => {
                const location = locationInput.value.trim();
                if (!location) {
                    alert('Please enter a location.');
                    return;
                }

                // 1. Fetch Coordinates via Open-Meteo Geocoding API
                try {
                    const geocodeResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1&language=en&format=json`);
                    const geocodeData = await geocodeResponse.json();

                    if (!geocodeData.results || geocodeData.results.length === 0) {
                        alert('Could not find location coordinates. Please try another city.');
                        return;
                    }

                    const result = geocodeData.results[0];
                    const lat = result.latitude;
                    const lon = result.longitude;
                    const locationName = `${result.name}, ${result.country || ''}`;

                    // Save coordinates and name to localStorage
                    localStorage.setItem('selectedLocation', locationName);
                    localStorage.setItem('selectedLatitude', lat);
                    localStorage.setItem('selectedLongitude', lon);

                    // Update input to show full matched name
                    locationInput.value = locationName;

                    // 2. Fetch current weather details
                    fetchWeather(locationName, lat, lon);

                } catch (err) {
                    console.error('Geocoding error:', err);
                    alert('An error occurred during location lookup.');
                }
            });

            async function fetchWeather(locationName, lat, lon) {
                try {
                    // Fetch weather using coordinates or location query
                    const currentWeatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code`);
                    const currentWeatherData = await currentWeatherResponse.json();

                    if (!currentWeatherResponse.ok || !currentWeatherData.current) {
                        alert('Error fetching weather data.');
                        return;
                    }

                    // Display current weather as beautiful styled metric cards
                    currentWeatherDiv.innerHTML = `
                        <div class="metric-card">
                            <div class="metric-label">🌡️ Temperature</div>
                            <div class="metric-value">${currentWeatherData.current.temperature_2m.toFixed(1)}°C</div>
                        </div>
                        <div class="metric-card" style="border-left-color: #0077b6; background: rgba(0, 119, 182, 0.05);">
                            <div class="metric-label" style="color: #0077b6;">💧 Humidity</div>
                            <div class="metric-value" style="color: #03045e;">${currentWeatherData.current.relative_humidity_2m}%</div>
                        </div>
                        <div class="metric-card" style="border-left-color: #e07a5f; background: rgba(224, 122, 95, 0.08);">
                            <div class="metric-label" style="color: #c95a3b;">☁️ Conditions</div>
                            <div class="metric-value" style="color: #a83d20; font-size: 18px; font-weight:700; margin-top:12px; text-transform:capitalize;">${describeWeatherCode(currentWeatherData.current.weather_code)}</div>
                        </div>
                    `;

                    weatherDiv.style.display = 'block';
                } catch (error) {
                    alert('An error occurred while fetching weather data.');
                    console.error(error);
                }
            }
        });
    </script>
</body>
</html>
