<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - GreenPulse Imaging</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/assets/css/styles.css">
    <link rel="stylesheet" href="/src/assets/css/chatbot.css">
</head>
<body>

    <div id="site-header-placeholder"></div>

    <!-- Dashboard Main Layout -->
    <main class="container dashboard-layout">
        <div class="dashboard-title-bar">
            <h2>Forestry Analytics Dashboard</h2>
            <p>Select an analysis module below to process imagery and view real-time ecological indices.</p>
        </div>

        <!-- Dashboard Sub-Tabs -->
        <div class="dashboard-tabs">
            <button id="detection-button" class="tab-button active">Tree Count</button>
            <button id="segmentation-button" class="tab-button">Green Cover</button>
            <button id="species-button" class="tab-button">Tree Species</button>
            <button id="path-button" class="tab-button">Optimal Pathing</button>
            <button id="health-button" class="tab-button">Forest Health</button>
            <button id="historical-button" class="tab-button">Historical Data</button>
        </div>

        <!-- Main Display Iframe Frame -->
        <div class="iframe-container">
            <iframe id="iframe-detection" src="object_detection.html" title="Tree Count"></iframe>
            <iframe id="iframe-segmentation" src="" title="Green Cover" style="display: none;"></iframe>
            <iframe id="iframe-species" src="" title="Tree Species" style="display: none;"></iframe>
            <iframe id="iframe-path" src="" title="Optimal Pathing" style="display: none;"></iframe>
            <iframe id="iframe-health" src="" title="Forest Health" style="display: none;"></iframe>
            <iframe id="iframe-historical" src="" title="Historical Data" style="display: none;"></iframe>
        </div>
    </main>

    <div id="site-footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/src/assets/js/shared/site-chrome.js"></script>
    <script src="/src/assets/js/script.js"></script>
    <script src="/src/assets/js/shared/tab-wiring.js"></script>
    <script>
        GreenPulse.wireLazyIframes([
            { id: 'detection-button', iframeId: 'iframe-detection', src: 'object_detection.html' },
            { id: 'segmentation-button', iframeId: 'iframe-segmentation', src: 'object_segmentation.html' },
            { id: 'species-button', iframeId: 'iframe-species', src: 'tree_species.html' },
            { id: 'path-button', iframeId: 'iframe-path', src: 'optimal_path.html' },
            { id: 'health-button', iframeId: 'iframe-health', src: 'forest_health.html' },
            { id: 'historical-button', iframeId: 'iframe-historical', src: 'historical_data.html' }
        ]);
    </script>
    <script src="/src/assets/js/chatbot.js" defer></script>
</body>
</html>
