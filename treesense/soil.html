<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Moisture Levels</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <link rel="stylesheet" href="/src/assets/css/styles.css">
</head>
<body class="chart-page">
    <div class="chart-container">
        <canvas id="soilChart" width="800" height="450"></canvas>
    </div>

    <script src="/src/assets/js/shared/weather-charts.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const result = await GreenPulse.fetchMonthlySeries({
                url: function(lat, lon) {
                    return `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=2025-01-01&end_date=2025-12-31&daily=soil_moisture_0_to_7cm&timezone=auto`;
                },
                responseSection: 'daily',
                field: 'soil_moisture_0_to_7cm',
                aggregation: 'mean',
                valueScale: 100,
                rounding: 'fixed1',
                fallback: [22.4, 18.5, 15.2, 14.1, 25.8, 38.4, 42.6, 40.2, 45.1, 48.3, 35.6, 26.2],
                errorMessage: "Failed to fetch live historical soil moisture, using fallback."
            });
            GreenPulse.createWeatherChart({
                canvasId: 'soilChart',
                chartType: 'bar',
                dataset: {
                    label: 'Soil Moisture Level (%)',
                    data: result.values,
                    backgroundColor: [
                        'rgba(45, 106, 79, 0.65)', 'rgba(82, 183, 136, 0.65)',
                        'rgba(116, 198, 157, 0.65)', 'rgba(149, 213, 178, 0.65)',
                        'rgba(183, 228, 199, 0.65)', 'rgba(216, 243, 220, 0.65)',
                        'rgba(45, 106, 79, 0.65)', 'rgba(82, 183, 136, 0.65)',
                        'rgba(116, 198, 157, 0.65)', 'rgba(149, 213, 178, 0.65)',
                        'rgba(183, 228, 199, 0.65)', 'rgba(216, 243, 220, 0.65)'
                    ],
                    borderColor: [
                        '#1b4332', '#2d6a4f', '#40916c', '#52b788', '#74c69d', '#95d5b2',
                        '#1b4332', '#2d6a4f', '#40916c', '#52b788', '#74c69d', '#95d5b2'
                    ],
                    borderWidth: 2,
                    borderRadius: 6
                },
                location: result.location,
                title: 'Average Soil Moisture (0-7cm) in ',
                yTickSuffix: '%',
                yAxis: { beginAtZero: true, max: 100 },
                legend: { display: false }
            });
        });
    </script>
</body>
</html>
