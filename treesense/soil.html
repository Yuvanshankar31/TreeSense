<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Moisture Levels</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js" integrity="sha384-7NrRHqlWUj2hJl3a/dZj/a1GxuQc56mJ3aYsEnydBYrY1jR+RSt6SBvK3sHfj+mJ" crossorigin="anonymous"></script>
    <script src="/src/assets/js/coordinates.js"></script>
    <link rel="stylesheet" href="/src/assets/css/styles.css">
    <style>
        body {
            background: #ffffff;
            padding: 20px;
        }
        .chart-container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <canvas id="soilChart" width="800" height="450"></canvas>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const { lat, lon } = getSelectedCoordinates(11.0168, 76.9558);
            const storedLocation = localStorage.getItem('selectedLocation') || 'Selected Location';

            const ctx = document.getElementById('soilChart').getContext('2d');
            
            // Default fallback monthly soil moisture averages (volumetric water content in %)
            let monthlyMoisture = [22.4, 18.5, 15.2, 14.1, 25.8, 38.4, 42.6, 40.2, 45.1, 48.3, 35.6, 26.2];
            let usedFallback = false;

            try {
                // Fetch daily historical soil moisture (0-7cm) for the full year of 2025
                const response = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=2025-01-01&end_date=2025-12-31&daily=soil_moisture_0_to_7cm&timezone=auto`);
                if (!response.ok) {
                    throw new Error(`Archive API returned status ${response.status}`);
                }
                const result = await response.json();
                
                if (result.daily && result.daily.soil_moisture_0_to_7cm) {
                    const times = result.daily.time;
                    const values = result.daily.soil_moisture_0_to_7cm;
                    
                    // Aggregate daily to monthly averages
                    const aggregatedSums = Array(12).fill(0);
                    const aggregatedCounts = Array(12).fill(0);
                    
                    for (let i = 0; i < times.length; i++) {
                        const date = new Date(times[i]);
                        const month = date.getMonth(); // 0-11
                        // Volumetric water content m³/m³ converted to percentage
                        aggregatedSums[month] += ((values[i] || 0) * 100);
                        aggregatedCounts[month]++;
                    }
                    
                    monthlyMoisture = aggregatedSums.map((sum, index) => {
                        return aggregatedCounts[index] > 0 ? parseFloat((sum / aggregatedCounts[index]).toFixed(1)) : 0;
                    });
                } else {
                    throw new Error(result.reason || "Response is missing daily soil moisture data");
                }
            } catch (err) {
                usedFallback = true;
                console.error("Failed to fetch live historical soil moisture, using fallback.", err);
            }

            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: months,
                    datasets: [{
                        label: 'Soil Moisture Level (%)',
                        data: monthlyMoisture,
                        backgroundColor: [
                            'rgba(45, 106, 79, 0.65)',
                            'rgba(82, 183, 136, 0.65)',
                            'rgba(116, 198, 157, 0.65)',
                            'rgba(149, 213, 178, 0.65)',
                            'rgba(183, 228, 199, 0.65)',
                            'rgba(216, 243, 220, 0.65)',
                            'rgba(45, 106, 79, 0.65)',
                            'rgba(82, 183, 136, 0.65)',
                            'rgba(116, 198, 157, 0.65)',
                            'rgba(149, 213, 178, 0.65)',
                            'rgba(183, 228, 199, 0.65)',
                            'rgba(216, 243, 220, 0.65)'
                        ],
                        borderColor: [
                            '#1b4332',
                            '#2d6a4f',
                            '#40916c',
                            '#52b788',
                            '#74c69d',
                            '#95d5b2',
                            '#1b4332',
                            '#2d6a4f',
                            '#40916c',
                            '#52b788',
                            '#74c69d',
                            '#95d5b2'
                        ],
                        borderWidth: 2,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Average Soil Moisture (0-7cm) in ' + storedLocation + ' (2025)' + (usedFallback ? ' — Offline Fallback Data' : ''),
                            font: {
                                size: 18,
                                family: "'Outfit', sans-serif",
                                weight: 'bold'
                            },
                            color: '#0f3425',
                            padding: 20
                        },
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
