<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Trends</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <link rel="stylesheet" href="/src/assets/css/styles.css">
</head>
<body class="chart-page">
    <div class="chart-container">
        <canvas id="tempChart" width="800" height="450"></canvas>
    </div>

    <script src="/src/assets/js/shared/weather-charts.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const result = await GreenPulse.fetchMonthlySeries({
                url: function(lat, lon) {
                    return `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=2025-01-01&end_date=2025-12-31&daily=temperature_2m_mean&timezone=auto`;
                },
                responseSection: 'daily',
                field: 'temperature_2m_mean',
                aggregation: 'mean',
                rounding: 'fixed1',
                fallback: [24.5, 25.8, 28.2, 30.1, 29.8, 27.6, 26.5, 26.3, 26.6, 26.4, 25.2, 24.1],
                errorMessage: "Failed to fetch live historical temperatures, using fallback."
            });
            GreenPulse.createWeatherChart({
                canvasId: 'tempChart',
                chartType: 'line',
                dataset: {
                    label: 'Mean Monthly Temperature (°C)',
                    data: result.values,
                    borderColor: '#2ec4b6',
                    backgroundColor: 'rgba(46, 196, 182, 0.1)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 3,
                    pointBackgroundColor: '#0f3425',
                    pointBorderColor: '#ffffff',
                    pointHoverRadius: 7
                },
                location: result.location,
                title: 'Mean Monthly Temperature in ',
                yTickSuffix: '°C'
            });
        });
    </script>
</body>
</html>
